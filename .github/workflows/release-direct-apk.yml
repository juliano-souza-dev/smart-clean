name: Publicar APK aprovado

# Acionado somente após aprovação explícita de testes e identificação da versão.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag nova aprovada (ex.: v0.4.0-beta.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-direct:
    name: Testar e disponibilizar APK beta direto
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar SDK Android 37
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" --install "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Testar módulos
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Validar versão e preparar nome
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]] || { echo 'Tag de beta inválida'; exit 1; }
          test ! -e "SmartClean-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "SmartClean-${VERSION}.apk"
          echo "APK_NAME=SmartClean-${VERSION}.apk" >> "$GITHUB_ENV"
      - name: Publicar binário em GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" "$APK_NAME" --target "$GITHUB_SHA" \
            --prerelease --title "Smart Clean $VERSION" \
            --notes "APK de teste beta para instalação direta. Instale somente após revisão dos testes e da versão."
