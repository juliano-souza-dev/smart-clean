name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Compilar APK de teste
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 37
        run: sdkmanager --install "platforms;android-37" "build-tools;36.0.0"

      - name: Configurar Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Compilar APK Debug
        run: gradle --no-daemon :app:assembleDebug

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: SmartClean-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
